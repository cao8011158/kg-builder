[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "research-kg-builder"
version = "0.1.0"
description = "Scientific literature metadata ingestion and versioned extraction store"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
semantic = ["numpy>=1.26,<3", "fastembed>=0.7,<1", "hnswlib>=0.8,<1", "igraph>=0.11,<2", "leidenalg>=0.10,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kg_builder.schemas" = ["*.json"]
